<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- Configurações básicas da página -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Informações para SEO -->
    <meta
            name="description"
            content="EstoquePro - Aplicativo para controle de estoque"
    >

    <!-- Cor principal do PWA -->
    <meta name="theme-color" content="#1f4e78">

    <!-- Título da página -->
    <title>EstoquePro</title>

    <!-- Arquivo de estilos -->
    <link rel="stylesheet" href="style.css">

    <!-- Configuração do PWA -->
    <link rel="manifest" href="manifest.json">

</head>

<body>


<!-- Cabeçalho do sistema -->
<header class="cabecalho">

    <div>
        <h1>EstoquePro</h1>
        <p>Controle de Estoque</p>
    </div>

    <!-- Ativa as notificações do navegador -->
    <button
            type="button"
            id="btnNotificacoes"
            class="btn-notificacao"
    >
        Ativar Notificações
    </button>

</header>


<!-- Conteúdo principal -->
<main>


    <!-- Dashboard -->
    <section class="dashboard">

        <h2>Dashboard</h2>


        <!-- Área dos indicadores -->
        <div class="dashboard-grid">


            <!-- Total de produtos cadastrados -->
            <article class="card-dashboard">

                <p>Total de Produtos</p>

                <strong id="totalProdutos">
                    0
                </strong>

            </article>


            <!-- Quantidade total de itens -->
            <article class="card-dashboard">

                <p>Total em Estoque</p>

                <strong id="totalEstoque">
                    0
                </strong>

            </article>


            <!-- Produtos abaixo do estoque mínimo -->
            <article class="card-dashboard card-alerta">

                <p>Estoque Baixo</p>

                <strong id="estoqueBaixo">
                    0
                </strong>

            </article>


        </div>

    </section>


    <!-- Produtos -->
    <section class="produtos-section">


        <!-- Cabeçalho da área de produtos -->
        <div class="produtos-cabecalho">

            <h2>Produtos</h2>

            <!-- Abre o formulário de cadastro -->
            <button
                    type="button"
                    id="btnMostrarFormulario"
            >
                + Novo Produto
            </button>

        </div>


        <!-- Formulário de cadastro -->
        <form id="formProduto">

            <!-- Nome -->
            <label for="nome">
                Nome do Produto
            </label>

            <input
                    type="text"
                    id="nome"
                    name="nome"
                    required
            >


            <!-- Categoria -->
            <label for="categoria">
                Categoria
            </label>

            <input
                    type="text"
                    id="categoria"
                    name="categoria"
                    required
            >


            <!-- Quantidade atual -->
            <label for="quantidade">
                Quantidade
            </label>

            <input
                    type="number"
                    id="quantidade"
                    name="quantidade"
                    min="0"
                    required
            >


            <!-- Quantidade usada para o alerta -->
            <label for="quantidadeMinima">
                Quantidade Mínima
            </label>

            <input
                    type="number"
                    id="quantidadeMinima"
                    name="quantidadeMinima"
                    min="0"
                    required
            >


            <!-- Preço unitário -->
            <label for="preco">
                Preço
            </label>

            <input
                    type="number"
                    id="preco"
                    name="preco"
                    min="0"
                    step="0.01"
                    required
            >


            <!-- Salva o novo produto -->
            <button type="submit">
                Salvar Produto
            </button>

        </form>


        <!-- Produtos criados pelo JavaScript -->
        <div id="listaProdutos"></div>


        <!-- Aparece quando não existem produtos -->
        <p id="mensagemSemProdutos">
            Nenhum produto cadastrado.
        </p>


    </section>

</main>


<!-- Funcionalidades do sistema -->
<script src="app.js"></script>

</body>

</html>
