<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- Configurações básicas da página -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Informações para SEO -->
    <meta
            name="description"
            content="EstoquePro - Aplicativo para controle e gestão de estoque"
    >

    <!-- Cor principal do PWA -->
    <meta name="theme-color" content="#1f4e78">

    <!-- Título exibido na aba do navegador -->
    <title>EstoquePro | Controle de Estoque</title>

    <!-- Ícone exibido na aba do navegador -->
    <link
            rel="icon"
            type="image/png"
            href="icons/icon-192.png"
    >

    <!-- Arquivo de estilos -->
    <link rel="stylesheet" href="style.css">

    <!-- Configuração do PWA -->
    <link rel="manifest" href="manifest.json">

</head>

<body>


<!-- Cabeçalho principal -->
<header class="cabecalho">

    <!-- Identificação do sistema -->
    <div class="marca">

        <!-- Ícone do EstoquePro -->
        <img
                src="icons/icon-192.png"
                alt=""
                class="logo"
        >

        <!-- Nome e descrição -->
        <div class="marca-texto">

            <h1>EstoquePro</h1>

            <p>
                Gestão simples de estoque
            </p>

        </div>

    </div>


    <!-- Ativa as notificações -->
    <button
            type="button"
            id="btnNotificacoes"
            class="btn-notificacao"
    >
        🔔 Ativar Notificações
    </button>

</header>


<!-- Conteúdo principal -->
<main>


    <!-- Dashboard -->
    <section class="dashboard">

        <h2>Dashboard</h2>


        <div class="dashboard-grid">


            <!-- Total de produtos -->
            <article class="card-dashboard">

                <p>Total de Produtos</p>

                <strong id="totalProdutos">
                    0
                </strong>

            </article>


            <!-- Total em estoque -->
            <article class="card-dashboard">

                <p>Total em Estoque</p>

                <strong id="totalEstoque">
                    0
                </strong>

            </article>


            <!-- Produtos com estoque baixo -->
            <article class="card-dashboard card-alerta">

                <p>Estoque Baixo</p>

                <strong id="estoqueBaixo">
                    0
                </strong>

            </article>


        </div>

    </section>


    <!-- Área de produtos -->
    <section class="produtos-section">


        <!-- Cabeçalho da seção -->
        <div class="produtos-cabecalho">

            <h2>Produtos</h2>


            <!-- Abre o formulário -->
            <button
                    type="button"
                    id="btnMostrarFormulario"
            >
                ➕ Novo Produto
            </button>

        </div>


        <!-- Formulário -->
        <form id="formProduto">


            <!-- Nome -->
            <div class="campo-formulario">

                <label for="nome">
                    Nome do Produto
                </label>

                <input
                        type="text"
                        id="nome"
                        name="nome"
                        required
                >

            </div>


            <!-- Categoria -->
            <div class="campo-formulario">

                <label for="categoria">
                    Categoria
                </label>

                <input
                        type="text"
                        id="categoria"
                        name="categoria"
                        required
                >

            </div>


            <!-- Quantidade -->
            <div class="campo-formulario">

                <label for="quantidade">
                    Quantidade
                </label>

                <input
                        type="number"
                        id="quantidade"
                        name="quantidade"
                        min="0"
                        required
                >

            </div>


            <!-- Quantidade mínima -->
            <div class="campo-formulario">

                <label for="quantidadeMinima">
                    Quantidade Mínima
                </label>

                <input
                        type="number"
                        id="quantidadeMinima"
                        name="quantidadeMinima"
                        min="0"
                        required
                >

            </div>


            <!-- Preço -->
            <div class="campo-formulario campo-preco">

                <label for="preco">
                    Preço
                </label>

                <input
                        type="number"
                        id="preco"
                        name="preco"
                        min="0"
                        step="0.01"
                        required
                >

            </div>


            <!-- Salva ou atualiza o produto -->
            <button
                    type="submit"
                    class="btn-salvar"
            >
                💾 Salvar Produto
            </button>

        </form>


        <!-- Produtos criados pelo JavaScript -->
        <div id="listaProdutos"></div>


        <!-- Mensagem de lista vazia -->
        <p id="mensagemSemProdutos">
            Nenhum produto cadastrado.
        </p>


    </section>

</main>


<!-- Funcionalidades -->
<script src="app.js"></script>

</body>

</html>
