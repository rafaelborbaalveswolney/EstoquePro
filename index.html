<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <!-- Configurações básicas da página -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Informações para SEO -->
    <meta
            name="description"
            content="EstoquePro - Aplicativo para controle de estoque"
    >

    <!-- Cor principal do PWA -->
    <meta name="theme-color" content="#1f4e78">

    <!-- Título da página -->
    <title>EstoquePro</title>

    <!-- Arquivo de estilos -->
    <link rel="stylesheet" href="style.css">

    <!-- Configuração do PWA -->
    <link rel="manifest" href="manifest.json">

</head>

<body>


<!-- Cabeçalho do sistema -->
<header class="cabecalho">

    <div>
        <h1>EstoquePro</h1>
        <p>Controle de Estoque</p>
    </div>

    <!-- Ativa as notificações -->
    <button
            type="button"
            id="btnNotificacoes"
            class="btn-notificacao"
    >
        🔔 Ativar Notificações
    </button>

</header>


<!-- Conteúdo principal -->
<main>


    <!-- Dashboard -->
    <section class="dashboard">

        <h2>Dashboard</h2>

        <div class="dashboard-grid">


            <!-- Total de produtos -->
            <article class="card-dashboard">

                <p>Total de Produtos</p>

                <strong id="totalProdutos">
                    0
                </strong>

            </article>


            <!-- Total em estoque -->
            <article class="card-dashboard">

                <p>Total em Estoque</p>

                <strong id="totalEstoque">
                    0
                </strong>

            </article>


            <!-- Estoque baixo -->
            <article class="card-dashboard card-alerta">

                <p>Estoque Baixo</p>

                <strong id="estoqueBaixo">
                    0
                </strong>

            </article>


        </div>

    </section>


    <!-- Área de produtos -->
    <section class="produtos-section">


        <!-- Cabeçalho da seção -->
        <div class="produtos-cabecalho">

            <h2>Produtos</h2>

            <!-- Abre o formulário -->
            <button
                    type="button"
                    id="btnMostrarFormulario"
            >
                ➕ Novo Produto
            </button>

        </div>


        <!-- Formulário de cadastro -->
        <form id="formProduto">


            <!-- Campo do nome -->
            <div class="campo-formulario">

                <label for="nome">
                    Nome do Produto
                </label>

                <input
                        type="text"
                        id="nome"
                        name="nome"
                        required
                >

            </div>


            <!-- Campo da categoria -->
            <div class="campo-formulario">

                <label for="categoria">
                    Categoria
                </label>

                <input
                        type="text"
                        id="categoria"
                        name="categoria"
                        required
                >

            </div>


            <!-- Campo da quantidade -->
            <div class="campo-formulario">

                <label for="quantidade">
                    Quantidade
                </label>

                <input
                        type="number"
                        id="quantidade"
                        name="quantidade"
                        min="0"
                        required
                >

            </div>


            <!-- Campo da quantidade mínima -->
            <div class="campo-formulario">

                <label for="quantidadeMinima">
                    Quantidade Mínima
                </label>

                <input
                        type="number"
                        id="quantidadeMinima"
                        name="quantidadeMinima"
                        min="0"
                        required
                >

            </div>


            <!-- Campo do preço -->
            <div class="campo-formulario campo-preco">

                <label for="preco">
                    Preço
                </label>

                <input
                        type="number"
                        id="preco"
                        name="preco"
                        min="0"
                        step="0.01"
                        required
                >

            </div>


            <!-- Botão de salvar -->
            <button
                    type="submit"
                    class="btn-salvar"
            >
                💾 Salvar Produto
            </button>

        </form>


        <!-- Produtos criados pelo JavaScript -->
        <div id="listaProdutos"></div>


        <!-- Mensagem quando não há produtos -->
        <p id="mensagemSemProdutos">
            Nenhum produto cadastrado.
        </p>


    </section>

</main>


<!-- Funcionalidades do sistema -->
<script src="app.js"></script>

</body>

</html>
